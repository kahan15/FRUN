[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "territory-run"
version = "0.3.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.121,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2",
  "shapely>=2.0,<3", "pyproj>=3.7,<4", "pydantic-settings>=2.7,<3",
  "PyJWT[crypto]>=2.10,<3", "argon2-cffi>=23,<26", "structlog>=25,<27",
  "email-validator>=2,<3", "httpx[http2]>=0.28,<1", "cryptography>=50,<51"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a disposable PostGIS database"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
