name: territory-run
x-backend: &backend
  build:
    context: ./backend
    target: runtime
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://territory:${POSTGRES_PASSWORD:?Run scripts/setup.sh first}@db:5432/territory
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'

services:
  db:
    image: postgis/postgis:16-3.5
    platform: linux/amd64
    environment:
      POSTGRES_USER: territory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup.sh first}
      POSTGRES_DB: territory
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U territory -d territory']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: '10m', max-file: '3'}
  migrate:
    <<: *backend
    command: ['alembic', 'upgrade', 'head']
    restart: 'no'
    depends_on:
      db: {condition: service_healthy}
  api:
    <<: *backend
    ports: ['${API_BIND_ADDRESS:-0.0.0.0}:8000:8000']
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 5
  expiry:
    <<: *backend
    command: ['python', '-m', 'app.workers.expiry']
    depends_on:
      migrate: {condition: service_completed_successfully}
  push:
    <<: *backend
    profiles: [push]
    command: ['python', '-m', 'app.workers.push']
    volumes: ['./secrets:/run/secrets:ro']
    depends_on:
      migrate: {condition: service_completed_successfully}
  test-db:
    profiles: [test]
    image: postgis/postgis:16-3.5
    platform: linux/amd64
    environment:
      POSTGRES_USER: territory
      POSTGRES_PASSWORD: disposable-test-password
      POSTGRES_DB: territory_test
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U territory -d territory_test']
      interval: 2s
      timeout: 3s
      retries: 30
  test:
    profiles: [test]
    build:
      context: ./backend
      target: test
    environment:
      JWT_SECRET: test-only-secret-that-is-never-used-in-production
      DATABASE_URL: postgresql+psycopg://territory:disposable-test-password@test-db:5432/territory_test
      TEST_DATABASE_URL: postgresql+psycopg://territory:disposable-test-password@test-db:5432/territory_test
    depends_on:
      test-db: {condition: service_healthy}
