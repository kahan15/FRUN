name: TerritoryRun
options:
  bundleIdPrefix: com.territoryrun
  deploymentTarget:
    iOS: '17.0'
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Local.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: 'NO'
    MARKETING_VERSION: 0.3.0
    CURRENT_PROJECT_VERSION: '3'
targets:
  TerritoryRun:
    type: application
    platform: iOS
    sources:
    - path: TerritoryRun
      excludes:
      - Resources/Info-*.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: $(APPLE_TEAM_ID)
      configs:
        Debug:
          INFOPLIST_FILE: TerritoryRun/Resources/Info-Debug.plist
        Release:
          INFOPLIST_FILE: TerritoryRun/Resources/Info-Release.plist
    preBuildScripts:
    - name: Validate release configuration
      script: |
        if [ "$CONFIGURATION" = "Release" ]; then
          /usr/bin/python3 "$SRCROOT/../scripts/check-release.py" --environment
        fi
      basedOnDependencyAnalysis: false
      inputFiles:
      - $(SRCROOT)/../scripts/check-release.py
    scheme:
      testTargets:
      - TerritoryRunTests
  TerritoryRunTests:
    type: bundle.unit-test
    platform: iOS
    sources:
    - TerritoryRunTests
    dependencies:
    - target: TerritoryRun
    settings:
      base:
        GENERATE_INFOPLIST_FILE: 'YES'
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/TerritoryRun.app/TerritoryRun
        BUNDLE_LOADER: $(TEST_HOST)
